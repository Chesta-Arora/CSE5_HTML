<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form</title>
</head>
<body>
   <form action="" name="registration form">
    <label for="first name">First name</label>
<input type="text" id="first name"value="Chesta" required>
<br>
<label for="last name">Last name</label>
<input type="text" id="last name"placeholder="Arora">
<br>
<label for="age">Age</label>
<input type="number" name="age" id="age" min="16" max="110">
<br>
<label for="email">Email</label>
<input type="email" id="email">
<br>
<label for="phone">Phone Number</label>
<input type="tel" id="phone"placeholder="1234567890" minlength="10" maxlength="12">
<br>
<label for="dob">DOB</label>
<input type="date" id="dob">
<br>
<label for="stream">Stream</label>
<select name="stream" id="stream">
    <option value="Arts">Arts</option>
    <option value="PCM">PCM</option>
    <option value="PCB">PCB</option>
</select>
<br>
<label for="male">Male</label>
<input type="radio" name="gender" id="male">
<label for="female">Female</label>
<input type="radio" name="gender" id="female">
<br>
<label for="obc">OBC</label>
<input type="checkbox" name="status" id="obc">
<label for="general">Genral</label>
<input type="checkbox" name="status" id="general">
<label for="ews">EWS</label>
<input type="checkbox" name="status" id="ews">
<br>
<label for="password">Password</label>
<input type="password" name="password" id="password">
<br>
<!-- <label for="submit">Submit</label> -->
<input type="submit">
<input type="reset">
   </form> 
</body>submit
